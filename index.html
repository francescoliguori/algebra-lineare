/* Pagina bianca e neutra: il colore di ogni argomento compare solo nei bordi e nei piccoli segni.

@font-face { font-family: "Jakarta"; src: url("font/plus-jakarta-sans-latin.woff2") format("woff2"); font-weight: 200 800; font-style: normal; font-display: swap; }
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f5f6f8; --surface-3: #eceef2; --line: #e6e8ec; --line-2: #d3d7dd;
  --ink: #14181d; --muted: #5f6873; --accent: #2b67b0; --on-ink: #ffffff; --ombra: rgba(20, 24, 29, .07);
  --ok: #23774c; --ok-bg: #e5f4eb; --err: #b23d33; --err-bg: #fce9e6; --star: #c48a1e;
  --insiemi: #ec8b5e; --spazi: #4cb584; --matrici: #5b96de; --applicazioni: #e0ad2d;
  --combinatorio: #e6779a; --autovalori: #3cb1b9; --determinante: #b4916a;
  --raggio: 18px; --hh: 60px; --filtro-figura: none;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-titoli: "Jakarta", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f11; --surface: #14171a; --surface-2: #1b1f23; --surface-3: #252a2f; --line: #262b31; --line-2: #363c43;
    --ink: #eceff2; --muted: #9aa3ad; --accent: #8db6ea; --on-ink: #0d0f11; --ombra: rgba(0, 0, 0, .35);
    --ok: #7fd1a3; --ok-bg: #15291d; --err: #f0a196; --err-bg: #341d1a; --star: #e2bd5a;
    --insiemi: #f2a07a; --spazi: #6ccf9f; --matrici: #82b3f0; --applicazioni: #ebc65c;
    --combinatorio: #f191ae; --autovalori: #5fcad1; --determinante: #cdb08a;
    --filtro-figura: invert(.9) hue-rotate(180deg);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f11; --surface: #14171a; --surface-2: #1b1f23; --surface-3: #252a2f; --line: #262b31; --line-2: #363c43;
  --ink: #eceff2; --muted: #9aa3ad; --accent: #8db6ea; --on-ink: #0d0f11; --ombra: rgba(0, 0, 0, .35);
  --ok: #7fd1a3; --ok-bg: #15291d; --err: #f0a196; --err-bg: #341d1a; --star: #e2bd5a;
  --insiemi: #f2a07a; --spazi: #6ccf9f; --matrici: #82b3f0; --applicazioni: #ebc65c;
  --combinatorio: #f191ae; --autovalori: #5fcad1; --determinante: #cdb08a;
  --filtro-figura: invert(.9) hue-rotate(180deg);
  color-scheme: dark;
}
.cat-insiemi { --cat: var(--insiemi); }
.cat-spazi { --cat: var(--spazi); }
.cat-matrici { --cat: var(--matrici); }
.cat-applicazioni { --cat: var(--applicazioni); }
.cat-combinatorio { --cat: var(--combinatorio); }
.cat-autovalori { --cat: var(--autovalori); }
.cat-determinante { --cat: var(--determinante); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--font-titoli); text-wrap: balance; letter-spacing: -.02em; }
h2 { font-size: 1.2rem; line-height: 1.3; font-weight: 700; }

/* intestazione */
header { background: var(--bg); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--bg); }
.barra { max-width: 920px; margin: 0 auto; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; }
.marchio { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--ink); flex: 1 1 auto; min-width: 0; }
/* logo: λ disegnata a tratti, quadrato del colore del testo (segue il tema) con il bordo nei colori degli argomenti */
.logo { width: 36px; height: 36px; flex: none; display: block; }
.logo-fondo { fill: var(--ink); }
.logo-segno { fill: none; stroke: var(--on-ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.marchio strong { font: 700 1.04rem/1.2 var(--font-titoli); letter-spacing: -.015em; }
nav { display: flex; gap: 4px; }
nav a { display: flex; align-items: center; gap: 7px; color: var(--muted); padding: 7px 13px; border-radius: 10px; text-decoration: none;
  font: 600 .92rem/1.2 var(--font-titoli); transition: color .15s, background-color .15s; }
nav a svg { width: 18px; height: 18px; flex: none; }
nav a:hover { color: var(--ink); }
nav a.attivo { color: var(--ink); background: var(--surface-3); }

main { max-width: 920px; margin: 0 auto; padding-block: 32px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--raggio); padding: 22px 24px; margin: 16px 0; box-shadow: 0 1px 2px var(--ombra); }
.card.esercizio { box-shadow: inset 0 3px 0 var(--cat, var(--line-2)), 0 1px 2px var(--ombra); }

/* pulsanti */
button { font: inherit; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--on-ink); padding: 9px 17px; border-radius: 11px; cursor: pointer;
  font: 600 .95rem/1.3 var(--font-titoli); letter-spacing: -.005em; transition: opacity .15s, background-color .15s, transform .05s; }
.btn:hover { opacity: .86; } .btn:active { transform: translateY(1px); }
.btn.sec { background: var(--surface); color: var(--ink); border-color: var(--line-2); }
.btn.sec:hover { background: var(--surface-2); opacity: 1; }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.btn.tondo { padding: 7px 12px; min-width: 2.6em; }
button.mini { font-size: .85rem; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; }
button.mini:hover { background: var(--surface-2); }
button.mini.piu { background: var(--ink); color: var(--on-ink); border-color: var(--ink); font-weight: 600; }
button.mini:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* home: gli argomenti */
.saluto { margin: 4px 0 28px; }
.occhiello { margin: 0 0 10px; font: 600 .74rem/1.3 var(--font-titoli); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.saluto h1 { font-size: clamp(2rem, 5vw, 2.7rem); line-height: 1.06; margin: 0 0 12px; font-weight: 800; letter-spacing: -.035em; }
.saluto .sotto { margin: 0; color: var(--muted); font-size: 1.04rem; }
.argomenti { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 820px) { .argomenti { grid-template-columns: 1fr 1fr; gap: 12px; } }
.tile { --sfondo: var(--surface); text-align: left; color: var(--ink); background: var(--sfondo); border: 2px solid var(--cat); border-radius: 18px;
  padding: 18px 18px 16px; min-height: 128px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
  transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease; }
.tile .nome { font: 700 1.08rem/1.22 var(--font-titoli); letter-spacing: -.015em; text-wrap: balance; }
.tile .meta { font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile .meta b { color: var(--ink); font-weight: 650; }
.tile:disabled { opacity: .5; cursor: default; }
@media (hover: hover) {
  .tile:not(:disabled):hover { --sfondo: color-mix(in srgb, var(--cat) 6%, var(--surface)); transform: translateY(-3px);
    box-shadow: 0 14px 26px -16px color-mix(in srgb, var(--cat) 80%, transparent), 0 2px 6px -3px var(--ombra); }
}
.tile:not(:disabled):active { transform: scale(.985); }
/* «Tutti gli argomenti»: il bordo raccoglie i colori di tutti */
.tile.cat-tutti { --cat: var(--matrici); border-color: transparent;
  background: linear-gradient(var(--sfondo), var(--sfondo)) padding-box,
    linear-gradient(120deg, var(--insiemi), var(--applicazioni), var(--spazi), var(--autovalori), var(--matrici), var(--combinatorio)) border-box; }
.altre { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 14px; }
.altra { display: flex; align-items: center; gap: 14px; text-align: left; border: none; background: var(--ink); color: var(--on-ink); border-radius: 18px;
  padding: 16px 20px 16px 16px; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; }
.altra .icona { width: 44px; height: 44px; flex: none; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--on-ink) 13%, transparent); }
.altra .icona svg { width: 22px; height: 22px; }
.altra strong { display: block; font: 700 1.04rem/1.3 var(--font-titoli); letter-spacing: -.01em; }
.altra small { display: block; font-size: .85rem; color: color-mix(in srgb, var(--on-ink) 68%, transparent); }
.altra .freccia { margin-left: auto; font-size: 1.25rem; transition: transform .2s ease; }
@media (hover: hover) {
  .altra:hover { transform: translateY(-2px); box-shadow: 0 14px 26px -16px var(--ombra), 0 10px 24px -14px rgba(20, 24, 29, .5); }
  .altra:hover .freccia { transform: translateX(4px); }
}

/* barra dentro un argomento */
.strumenti { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.riga-nav { display: flex; align-items: center; gap: 8px; }
.riga-nav .pillola { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.riga-nav .btn, .riga-nav .pos, .indietro { flex: none; }
.indietro { border: none; background: none; color: var(--muted); cursor: pointer; padding: 6px 2px; font: 600 .95rem/1.2 var(--font-titoli); }
.indietro:hover { color: var(--ink); }
.pillola { display: inline-flex; align-items: center; gap: 6px; font: 650 .85rem/1.3 var(--font-titoli); padding: 4px 12px; border-radius: 99px;
  background: var(--surface); border: 1.5px solid var(--cat, var(--line-2)); color: var(--ink); }
.pos { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .92rem; }
.spazio { flex: 1; }
.filtri-riga { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; border: 1px solid var(--line-2); border-radius: 99px; padding: 4px 12px;
  background: var(--surface); color: var(--muted); font-size: .88rem; user-select: none; transition: background-color .15s, border-color .15s; }
.chips label.on { background: color-mix(in srgb, var(--cat, var(--ink)) 9%, var(--surface)); color: var(--ink); border-color: var(--cat, var(--ink)); }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips .stelle { color: var(--star); }
.pallino { width: 8px; height: 8px; border-radius: 50%; background: var(--cat, var(--muted)); flex: none; }
select { font: inherit; font-size: .9rem; padding: 6px 9px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); color: var(--ink); max-width: 100%; }
details.indice summary { cursor: pointer; color: var(--muted); font-size: .9rem; width: fit-content; }
.griglia { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.griglia button { font-size: .85rem; min-width: 2.8em; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
.griglia button.corrente { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.griglia button.fatto::after { content: " ✓"; color: var(--ok); }
.griglia button.corrente.fatto::after { color: inherit; }

/* esercizio */
.testa { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.esercizio h2 { margin: 12px 0 8px; }
.stelle { color: var(--star); letter-spacing: 1px; white-space: nowrap; font-size: .9rem; }
.etichetta { display: inline-flex; align-items: center; gap: 7px; font: 650 .78rem/1.3 var(--font-titoli); padding: 3px 11px; border-radius: 99px;
  background: var(--surface); border: 1.5px solid var(--cat, var(--line-2)); color: var(--ink); }
.etichetta.grigia { background: none; border: none; color: var(--muted); font: 500 .8rem/1.3 var(--font); padding: 3px 0; }
.punti { font-weight: 700; margin-left: auto; font-variant-numeric: tabular-nums; }
.parte { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 18px; }
.lettera { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--ink); color: var(--on-ink);
  font: 700 .8rem/1 var(--font-titoli); margin-right: 7px; }
.campi { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
.campo { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); min-width: 0; box-shadow: inset 3px 0 transparent; }
.campo.inline { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.campo.inline > .esito, .campo.inline > div:empty { flex-basis: 100%; }
.campo.ok { box-shadow: inset 3px 0 var(--ok); }
.campo.no { box-shadow: inset 3px 0 var(--err); }
.campo .lbl { font-weight: 500; }
.campo .campo { background: var(--surface); }
.esito { font-size: .92rem; padding: 6px 10px; border-radius: 8px; }
.esito.ok { background: var(--ok-bg); color: var(--ok); }
.esito.no { background: var(--err-bg); color: var(--err); }
.riga { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
input.n { width: 4.4em; padding: 6px 7px; font: inherit; text-align: center; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); color: var(--ink); transition: border-color .15s, box-shadow .15s; }
input.n.largo { width: 10em; text-align: left; }
input.n.insieme { width: min(30em, 100%); text-align: left; }
input.n:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
input:disabled { opacity: .75; }
.vett { display: inline-flex; flex-direction: column; gap: 4px; padding: 3px 9px; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: 12px; }
.scorre { max-width: 100%; overflow-x: auto; }
.matr { display: inline-grid; gap: 4px; padding: 3px 9px; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: 4px; }
.piccolo { font-size: .85rem; color: var(--muted); }
.caso { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); }
.caso > .campi { margin-bottom: 0; }
.autoval { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); }
.azioni { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.soluzione { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin-top: 10px; overflow-x: auto; }
.f.attesa { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: .85em; }
.f .katex-display { margin: .4em 0; }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.completato { background: var(--ok-bg); color: var(--ok); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
.vuoto-stato { text-align: center; color: var(--muted); padding: 32px 16px; }

/* simulazione */
.barra-esame { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: calc(var(--hh) + 8px); z-index: 4; }
.timer { font: 800 1.25rem/1.2 var(--font-titoli); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.timer.poco { color: var(--err); }
table.ris { border-collapse: collapse; width: 100%; }
table.ris td { border-bottom: 1px solid var(--line); padding: 10px 6px; text-align: left; vertical-align: top; }
table.ris td:last-child { text-align: right; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.voto { font: 800 2.4rem/1.1 var(--font-titoli); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.avviso { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; font-size: .92rem; }
.slot { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
.slot div { border-radius: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); font-size: .9rem; }
.slot strong { display: block; font-family: var(--font-titoli); font-variant-numeric: tabular-nums; }
kbd { font-family: ui-monospace, Consolas, monospace; font-size: .88em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; white-space: nowrap; }
.guida li { margin: 6px 0; }
fieldset { border: none; padding: 0; margin: 0; min-width: 0; }
legend { font: 600 .74rem/1.3 var(--font-titoli); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 0; margin-bottom: 8px; }

/* home: tre voci */
.voci-home { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.voce-home { --sfondo: var(--surface); text-align: left; color: var(--ink); background: var(--sfondo); border: 2px solid var(--cat); border-radius: 20px;
  padding: 20px 20px 18px; min-height: 196px; cursor: pointer; display: flex; flex-direction: column; gap: 12px; text-decoration: none;
  transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease; }
.voce-home .icona { width: 46px; height: 46px; flex: none; border-radius: 13px; display: grid; place-items: center; background: color-mix(in srgb, var(--cat) 16%, var(--surface)); }
.voce-home .icona svg { width: 23px; height: 23px; }
.voce-home .testo { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.voce-home strong { font: 750 1.3rem/1.2 var(--font-titoli); letter-spacing: -.02em; }
.voce-home small { color: var(--muted); font-size: .93rem; line-height: 1.45; }
.voce-home .meta { font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.voce-home .meta b { color: var(--ink); font-weight: 650; }
@media (hover: hover) {
  .voce-home:hover { --sfondo: color-mix(in srgb, var(--cat) 6%, var(--surface)); transform: translateY(-3px);
    box-shadow: 0 16px 30px -18px color-mix(in srgb, var(--cat) 85%, transparent), 0 2px 6px -3px var(--ombra); }
}
.voce-home:active { transform: scale(.99); }
@media (max-width: 820px) {
  .voci-home { grid-template-columns: 1fr; gap: 12px; }
  .voce-home { min-height: 0; flex-direction: row; align-items: center; gap: 14px; padding: 16px; }
  .voce-home .meta { display: none; }
}

/* teoria */
.argomenti.capitoli { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 820px) { .argomenti.capitoli { grid-template-columns: 1fr 1fr; } }
.tile .occhiello { display: block; margin: 0 0 4px; font-size: .68rem; }
.testa-cap .occhiello { color: var(--cat, var(--muted)); }
.intro-cap:empty { display: none; }
.indice-cap { list-style: none; padding: 0; margin: 22px 0 0; border-top: 1px solid var(--line); }
.indice-cap li { border-bottom: 1px solid var(--line); }

a.btn { display: inline-block; text-decoration: none; }
.lettura { max-width: 47rem; font-size: 1.04rem; line-height: 1.72; }
.lettura > .occhiello { margin: 6px 0 4px; color: var(--cat, var(--muted)); }

.lettura p { margin: .75em 0; }
.lettura h3 { font-size: 1.12rem; margin: 1.7em 0 .3em; }
.lettura ul, .lettura ol { padding-left: 1.5em; margin: .6em 0; }
.lettura li { margin: .35em 0; }
.lettura .run { font-family: var(--font-titoli); font-weight: 700; }
.lettura code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; background: var(--surface-2); padding: 0 4px; border-radius: 4px; }
.lettura .nota { font-size: .9em; color: var(--muted); }
.lettura .f.attesa { font-family: ui-monospace, Consolas, monospace; font-size: .8em; color: var(--muted); overflow-wrap: anywhere; }
.lettura .f.attesa.blocco { display: block; text-align: center; min-height: 3em; padding: .6em 0; }
.lettura .katex-display { margin: .7em 0; }
ol.etich { list-style: none; counter-reset: voce; padding-left: 2.1em; }

.tm-nome { font: 700 .97em var(--font-titoli); letter-spacing: -.005em; }

.centro .tabella table { margin: 0 auto; }
.citazione { padding-left: 16px; border-left: 2px solid var(--line-2); color: var(--muted); }
.fine-sez { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); }

/* invito a installare l'app */
.installa { position: fixed; z-index: 30; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(380px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: 18px;
  box-shadow: 0 18px 40px -18px rgba(20, 24, 29, .45), 0 2px 8px -4px var(--ombra); padding: 16px; display: grid; grid-template-columns: auto 1fr; gap: 12px 14px;
  animation: entra .25s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.installa .logo { width: 44px; height: 44px; }
.installa strong { display: block; font: 700 1rem/1.3 var(--font-titoli); }
.installa p { margin: 2px 0 0; font-size: .88rem; color: var(--muted); line-height: 1.45; }
.installa .azioni { grid-column: 1 / -1; margin: 0; justify-content: flex-end; }
.installa .ios { display: inline-flex; align-items: center; gap: 4px; }
.installa .ios svg { width: 16px; height: 16px; vertical-align: -2px; }
@media (max-width: 640px) { .installa { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) { .installa { animation: none; } }

/* sfide (livello 4): il teschio */
.teschio { display: inline-flex; align-items: center; gap: 5px; font: 700 .76rem/1 var(--font-titoli); letter-spacing: .04em; text-transform: uppercase;
  padding: 4px 10px 4px 7px; border-radius: 99px; background: var(--ink); color: var(--on-ink); white-space: nowrap; }

.etichetta-sviluppo { font: 700 .66rem/1 var(--font-titoli); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px;

/* segnalazioni e piè di pagina */
.segnala { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; }
.segnala a, .piede a { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.segnala a { color: var(--muted); font-size: .86rem; }
.segnala a:hover { color: var(--ink); text-decoration: underline; }
.segnala svg, .piede svg { width: 15px; height: 15px; flex: none; }
.piede { border-top: 1px solid var(--line); }

@media (prefers-reduced-motion: reduce) { .tile, .altra, .altra .freccia, .btn, nav a { transition: none; } .tile:hover, .altra:hover, .tile:active { transform: none !important; } }

@media (max-width: 640px) {

  .barra-esame { top: 6px; }
  .lungo { display: none; }
}

// ====================================================================== frazioni esatte (BigInt)
class ErroreInput extends Error {}
const MAXCIFRE = 3000;
function gcdB(a, b) { if (a < 0n) a = -a; if (b < 0n) b = -b; while (b) { const r = a % b; a = b; b = r; } return a; }
class Q {
  constructor(n, d = 1n) {
    n = BigInt(n); d = BigInt(d);
    if (d === 0n) throw new ErroreInput("divisione per zero");
    if (d < 0n) { n = -n; d = -d; }
    const g = gcdB(n, d);
    if (g > 1n) { n /= g; d /= g; }
    this.n = n; this.d = d;
    if ((n > 10n ** 60n || n < -(10n ** 60n) || d > 10n ** 60n) && (n.toString().length > MAXCIFRE || d.toString().length > MAXCIFRE)) throw new ErroreInput("numero troppo grande");
  }
  add(o) { return new Q(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { return new Q(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { return new Q(this.n * o.n, this.d * o.d); }
  div(o) { if (o.n === 0n) throw new ErroreInput("divisione per zero"); return new Q(this.n * o.d, this.d * o.n); }
  neg() { return new Q(-this.n, this.d); }
  zero() { return this.n === 0n; }
  eq(o) { return this.n === o.n && this.d === o.d; }
  toString() { return this.d === 1n ? String(this.n) : this.n + "/" + this.d; }
}
const ZERO = new Q(0), UNO = new Q(1);

function analizza(testo, par) {
  const s = String(testo).trim().replace(/[−–—]/g, "-").replace(/[·×]/g, "*").replace(/:/g, "/").replace(/\s+/g, "");
  if (s === "") throw new ErroreInput("campo vuoto");
  const tok = [], pila = [];
  const inFunzione = () => pila[pila.length - 1] === "f";
  for (let i = 0; i < s.length;) {
    const c = s[i];
    if (c === "," && inFunzione()) { tok.push({ t: "," }); i++; continue; }
    if (/[0-9.,]/.test(c)) {
      let j = i, num = "";
      while (j < s.length) {
        const d = s[j];
        if (/[0-9]/.test(d)) { num += d; j++; continue; }
        if ((d === "." || (d === "," && !inFunzione())) && /[0-9]/.test(s[j + 1] || "") && !num.includes(".")) { num += "."; j++; continue; }
        break;

      try { vals = pezzi.map(s => num(s)); } catch (e) { if (e instanceof ErroreInput) return no(`Caso ${i + 1}: valori di ${par} non validi (${e.message}).`); throw e; }
    }
    cond.push({ modo: k.modo, vals });

    if (!gen.length) return no(`I casi non coprono tutti i valori di ${par}: manca il caso «${par} ≠ …» (oppure «per ogni ${par}»).`);
    if (gen.length > 1) return no(`Ci sono due casi «${par} ≠ …» (o «per ogni ${par}»): si sovrappongono.`);

      }

function widgetCasi(c, contesto) {
  const lista = el("div", { class: "campi", style: "margin:0" });
  let casi = [];
  const numera = () => casi.forEach((x, i) => { x.titolo.textContent = `Caso ${i + 1}`; });

    const sel = el("select", { "aria-label": "condizione sul parametro" });
    if (c.copertura === "speciali") sel.append(el("option", { value: "=" }, `${c.par} =`));
    else sel.append(el("option", { value: "" }, "condizione…"), el("option", { value: "=" }, `${c.par} =`),
      el("option", { value: "≠" }, `${c.par} ≠`), el("option", { value: "tutti" }, `per ogni ${c.par}`));
    const val = casella("", "largo"); val.placeholder = "es. 0, 1";
    sel.addEventListener("change", () => { val.hidden = sel.value === "tutti"; });

    : `Per ogni caso scegli la condizione su ${c.par}; insieme, i casi devono coprire tutti i valori di ${c.par}.`;
  return {
    el: el("div", { class: "campi", style: "margin:0" }, lista,
      el("div", { class: "riga" }, el("button", { class: "mini piu", type: "button", onclick: aggiungi }, "+ aggiungi caso"), el("span", { class: "piccolo" }, aiuto))),
    leggi: () => ({ casi: casi.map(x => ({ modo: x.sel.value, valori: x.val.value, risposte: x.sotto.map(s => s.w.leggi()) })) }),
    imposta: r => {

const IN_LINEA = new Set(["numero", "rango", "dim_ker", "dim_imm", "det", "sino", "iniettiva", "suriettiva", "invertibile", "appartiene", "scelta", "n_soluzioni", "insieme"]);
function creaCampo(c, contesto) {
  let w;
  switch (c.tipo) {
    case "numero": case "det": w = widgetNumero("largo"); break;
    case "rango": case "dim_ker": case "dim_imm": w = widgetNumero(""); break;
    case "sino": w = widgetSiNo(c.vf); break;
    case "iniettiva": case "suriettiva": case "invertibile": case "appartiene": w = widgetSiNo(false); break;
    case "scelta": w = widgetScelta(c.opzioni); break;
    case "n_soluzioni": w = widgetScelta(NSOL); break;
    case "insieme": w = widgetInsieme(); break;
    case "base_ker": w = widgetListaVettori({ vuoto: "è l'insieme vuoto (lo spazio è formato dal solo vettore nullo)" }); break;
    case "base_imm": w = widgetListaVettori({ vuoto: c.spazio ? "è l'insieme vuoto (lo spazio è formato dal solo vettore nullo)" : null }); break;
    case "eq_imm": w = widgetEquazioni(c.lettere); break;
    case "eq_ker": w = widgetEquazioni(c.variabili); break;
    case "vettore": w = widgetVettore(); break;
    case "matrice": w = widgetMatrice(); break;
    case "valori": w = widgetValori(c.par); break;
    case "controimmagine": w = widgetControimmagine(); break;
    case "completamento": w = widgetListaVettori({}); break;
    case "autovalori": w = widgetAutovalori(c); break;
    case "diagonalizzazione": w = widgetDiag(); break;
    case "casi": w = widgetCasi(c, contesto); break;
    case "combinazione": {
      const box = el("div", { class: "riga" });
      let coef = [];
      const memo = [];   // i valori scritti restano anche se la base cambia numero di vettori
      const ridisegna = quanti => {
        coef.forEach((x, i) => { memo[i] = x.value; }); box.innerHTML = ""; coef = [];
        for (let i = 0; i < quanti; i++) {
          const x = casella(memo[i] || ""); coef.push(x);
          box.append(x, formula(`\\,w_{${i + 1}}` + (i < quanti - 1 ? "\\;+" : ""), false));
        }
        if (!quanti) box.append(el("span", { class: "piccolo" }, "(scrivi prima la base nel punto indicato)"));
      };
      const rif = c.rif ? contesto.campo(c.rif[0], c.rif[1]) : null;
      if (rif) { ridisegna(rif.w.conta()); rif.w.quandoCambia(ridisegna); } else ridisegna(c.base.length);
      w = { el: box, leggi: () => coef.map(x => x.value), imposta: v => { ridisegna(v.length); coef.forEach((x, i) => { x.value = v[i]; }); } };
      w.base = () => rif ? rif.w.leggi().vettori : c.base;
      if (!rif) box.prepend(el("span", { class: "piccolo" }, "(w₁, w₂, … sono i vettori dati, nell'ordine del testo)"));
      break;
    }
    default: throw new Error("tipo sconosciuto " + c.tipo);
  }
  const esito = el("div");
  const etichetta = ricco(c.label, "div"); etichetta.classList.add("lbl");
  const nodo = el("div", { class: "campo" + (IN_LINEA.has(c.tipo) ? " inline" : "") }, etichetta, w.el, esito);
  return {
    c, w, nodo,
    controlla() { return verifica(c, w.leggi(), w.base ? w.base() : undefined); },
    mostra(r) {
      nodo.classList.toggle("ok", r.ok); nodo.classList.toggle("no", !r.ok);
      esito.className = "esito " + (r.ok ? "ok" : "no"); esito.innerHTML = ""; esito.append(r.ok ? "✓ " : "✗ ", testoConFormule(r.msg));
      if (w.mostraDettagli) w.mostraDettagli(r.dettagli);
    },
    pulisci() { nodo.classList.remove("ok", "no"); esito.className = ""; esito.innerHTML = ""; if (w.mostraDettagli) w.mostraDettagli(null); },
  };
}

    else if (!modoEsame) box.append(el("div", { class: "piccolo", style: "margin-top:6px" }, "Questa parte non si corregge in automatico: confronta con la soluzione."));

    if (!modoEsame) {

      if (campi.length) azioni.append(el("button", { class: "btn", type: "button", onclick: () => {
        campi.forEach(x => x.mostra(x.controlla()));
        if (quandoCompleto) quandoCompleto(tutti.flat().length > 0 && tutti.flat().every(x => x.controlla().ok));
      } }, "Verifica"));
      azioni.append(el("button", { class: "btn sec", type: "button", onclick: ev => {

    correggi(aggiorna) {
      card.querySelectorAll("input, select").forEach(i => { i.disabled = true; });
      card.querySelectorAll("button.mini").forEach(b => { b.disabled = true; });
      card.querySelectorAll(".soluzione").forEach(s => { s.hidden = false; });
      if (CONFIG.repo && !card.querySelector(".segnala")) card.append(nodoSegnala(e));
      const parti = tutti.map((campi, ip) => {
        if (campi.length) {
          let peso = 0, giusti = 0;
          campi.forEach(x => { const r = x.controlla(); x.mostra(r); const pz = r.peso || 1; peso += pz; giusti += r.ok ? pz : (r.giusti || 0); });
          return { peso, val: () => giusti / peso };
        }
        let v = 0;
        const nome = "r" + (++contaRadio);

        return { peso: 1, val: () => v };
      });
      return () => { const P = parti.reduce((s, p) => s + p.peso, 0); return P ? parti.reduce((s, p) => s + p.peso * p.val(), 0) / P : 0; };

let osservaFormule = null;
function formulaPigra(tex, display) {
  if (!("IntersectionObserver" in window)) return formula(tex, display);
  const sp = el("span", { class: "f attesa" + (display ? " blocco" : "") });
  sp.textContent = tex; sp._f = [tex, display];
  osservaFormule = osservaFormule || new IntersectionObserver(voci => voci.forEach(v => {
    if (!v.isIntersecting) return;
    osservaFormule.unobserve(v.target);
    const [t, d] = v.target._f; v.target.replaceWith(formula(t, d));
  }), { rootMargin: "800px 0px" });
  osservaFormule.observe(sp);
  return sp;
}
function riccoPigro(r, tag = "div") {
  const e = el(tag);

  }
  aggiorna();
  const riepilogo = el("div", { class: "card" }, el("div", { class: "piccolo" }, "Punteggio"), totale,
    el("table", { class: "ris" }, el("tbody", {}, ...esame.scelti.map((s, i) => el("tr", {},
      el("td", {}, el("strong", {}, `${i + 1}. `), ricco(s.e.titolo), el("div", { class: "piccolo" }, NOMI_CAT[s.e.categoria])), celle[i])))),
    el("p", { class: "piccolo" }, "Il punteggio di ogni esercizio è proporzionale alle risposte corrette; per le parti senza correzione automatica conta la tua autovalutazione, e il totale si aggiorna da solo."),
    el("div", { class: "azioni" }, el("button", { class: "btn", type: "button", onclick: () => { esame = null; vistaEsame(); } }, "Nuova simulazione")));

}

// ====================================================================== instradamento
function instrada() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  const v = h.startsWith("esame") ? "esame" : h.startsWith("guida") ? "guida"
    : /^(teoria|cap-|sez-)/.test(h) ? "teoria" : /^(esercizi|es[-/])/.test(h) ? "esercizi" : "home";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("attivo", a.dataset.v === v));
  let m;
  if (v === "esame") vistaEsame();
  else if (v === "guida") vistaGuida();
  else if (h === "teoria") vistaTeoria();
  else if ((m = /^cap-([a-z]+)$/.exec(h))) vistaCapitolo(m[1]);
  else if ((m = /^sez-([a-z]+)-(\d+)$/.exec(h))) vistaSezione(m[1], +m[2]);
  else if (h === "esercizi") vistaArgomenti();
  else if (/^es[-/]/.test(h)) vistaEsercizi(h.slice(3));
  else vistaHome();
  window.scrollTo(0, 0);
}

// ====================================================================== autotest (console: autotest())
function rispostaModello(c, m = c.modello) {
  switch (c.tipo) {
    case "base_ker": case "base_imm": return { vuoto: m.length === 0, vettori: m };
    case "completamento": return { vuoto: false, vettori: m };
    case "eq_imm": case "eq_ker": return { nessuna: m.length === 0, eq: m };
    case "valori": return { modo: m.modo, valori: m.valori.join(", ") };
    case "autovalori": return { righe: m.map(x => ({ l: x.l, m: x.m, base: { vuoto: false, vettori: x.base } })) };
    case "casi": return { casi: m.map(k => ({ modo: k.modo, valori: k.valori.join(", "), risposte: k.risposte.map((r, j) => rispostaModello(c.sotto[j], r)) })) };
    default: return m;
  }
}
function rispostaSbagliata(c, r) {
  const piu1 = s => `(${s})+1`;
  const unoDi = n => Array(n).fill("1");
  switch (c.tipo) {
    case "numero": case "rango": case "dim_ker": case "dim_imm": case "det": return piu1(r);
    case "sino": case "iniettiva": case "suriettiva": case "invertibile": case "appartiene": return !r;
    case "scelta": return (r + 1) % c.opzioni.length;
    case "n_soluzioni": return (r + 1) % 3;
    case "insieme": return r.trim() === "{}" ? "{999}" : r.replace(/\}\s*$/, ", 999}");
    case "base_ker": case "base_imm": case "completamento":
      if (!r.vettori.length) return { vuoto: false, vettori: [unoDi(c.tipo === "base_imm" ? c.A.length : c.tipo === "completamento" ? c.n : c.A[0].length)] };
      return r.vettori.length >= 2 ? { vuoto: false, vettori: r.vettori.slice(0, -1).concat([r.vettori[0]]) } : { vuoto: false, vettori: [] };
    case "eq_imm": case "eq_ker":
      if (!r.eq.length) return { nessuna: false, eq: [unoDi(c.tipo === "eq_imm" ? c.A.length : c.A[0].length)] };
      return { nessuna: false, eq: r.eq.concat([r.eq[0]]) };
    case "controimmagine": return r.vuoto ? { vuoto: false, xp: Array(c.A[0].length).fill("0"), base: [] } : { vuoto: true };
    case "vettore": return r.map((s, i) => i === 0 ? piu1(s) : s);
    case "matrice": return r.map((riga, i) => riga.map((s, j) => i === 0 && j === 0 ? piu1(s) : s));
    case "valori": return { modo: r.modo === "solo" ? "tranne" : "solo", valori: r.valori };
    case "combinazione": return r.map((s, i) => i === 0 ? piu1(s) : s);
    case "autovalori": return r.righe.length > 1 ? { righe: r.righe.slice(1) } : { righe: r.righe.map(x => ({ ...x, l: piu1(x.l) })) };
    case "diagonalizzazione": return r.non ? { non: false, P: [], D: [] } : { non: false, P: r.P, D: r.D.map((riga, i) => riga.map((s, j) => i === 0 && j === 0 ? piu1(s) : s)) };
    case "casi": {
      const k0 = r.casi[0];
      return { casi: [{ ...k0, risposte: k0.risposte.map((x, j) => j === 0 ? rispostaSbagliata(c.sotto[0], x) : x) }, ...r.casi.slice(1)] };
    }
  }
  throw new Error("manca la risposta sbagliata per " + c.tipo);
}
window.autotest = function (soloId) {
  const errori = []; let n = 0;
  const contenitore = el("div"); contenitore.hidden = true; document.body.append(contenitore);
  for (const e of DATI.esercizi) {
    if (soloId && e.id !== soloId) continue;
    const ex = creaEsercizio(e); contenitore.append(ex.el);
    ex.campi.flat().forEach(x => x.w.imposta(rispostaModello(x.c)));   // prima tutte le risposte (le combinazioni leggono le basi)
    ex.campi.forEach((parte, ip) => parte.forEach((x, ic) => {
      n++;
      const dove = `${e.id} ${LETTERE[ip]}) campo ${ic + 1} [${x.c.tipo}]`;
      try {
        const giusta = x.controlla();
        if (!giusta.ok) errori.push(`${dove}: modello rifiutato: ${giusta.msg}`);
        const r0 = rispostaModello(x.c);
        const prove = [rispostaSbagliata(x.c, r0)];
        if (x.c.tipo === "casi" && r0.casi.length > 1) prove.push({ casi: r0.casi.slice(0, -1) });
        for (const sb of prove) {
          x.w.imposta(sb);
          if (x.controlla().ok) errori.push(`${dove}: risposta sbagliata accettata: ${JSON.stringify(sb).slice(0, 160)}`);
        }
        x.w.imposta(r0);
      } catch (err) { errori.push(`${dove}: eccezione ${err.message}`); }
    }));
  }
  contenitore.remove();
  return { campi: n, errori };
};

// ---------------------------------------------------------------------- invito a installare l'app
// Chrome, Edge e Android mandano «beforeinstallprompt» quando la pagina è installabile: si mostra un riquadro con
// il pulsante «Installa», che apre la finestra del browser. Safari su iPhone non ha questo evento: si spiega come
// fare da «Condividi». Se lo studente sceglie «Non ora», l'invito torna dopo due settimane.
(function () {
  if (window.SENZA_SW) return;
  const installata = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (installata) return;
  const CHIAVE_INV = "algebra-invito-installa";
  const rimandato = () => { try { return Date.now() - (+localStorage.getItem(CHIAVE_INV) || 0) < 14 * 864e5; } catch (e) { return false; } };
  const rimanda = () => { try { localStorage.setItem(CHIAVE_INV, String(Date.now())); } catch (e) { /* niente */ } };
  let box = null;
  const chiudi = () => { if (box) { box.remove(); box = null; } };
  function mostra(testo, azione) {
    if (box || rimandato()) return;
    const logo = document.querySelector(".marchio .logo").cloneNode(true);
    logo.querySelector("linearGradient").id = "logo-bordo-2";
    logo.querySelector("rect").setAttribute("fill", "url(#logo-bordo-2)");
    const no = el("button", { class: "btn sec", type: "button", onclick: () => { rimanda(); chiudi(); } }, "Non ora");
    box = el("div", { class: "installa", role: "dialog", "aria-label": "Installa l'app" }, logo,
      el("div", {}, el("strong", {}, "Installa l'app"), el("p", {}, ...testo)),
      el("div", { class: "azioni" }, no, azione));
    document.body.append(box);
  }
  window.addEventListener("beforeinstallprompt", ev => {
    ev.preventDefault();
    const evento = ev;
    setTimeout(() => mostra(["Si apre dalla schermata Home come un'app e funziona anche senza connessione."],
      el("button", { class: "btn", type: "button", onclick: async () => {
        chiudi(); evento.prompt();
        try { const r = await evento.userChoice; if (r.outcome !== "accepted") rimanda(); } catch (e) { /* niente */ }
      } }, "Installa")), 2500);
  });
  window.addEventListener("appinstalled", chiudi);
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios) {
    const condividi = el("span", { class: "ios" });
    condividi.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg>Condividi';
    setTimeout(() => mostra(["Tocca ", condividi, " in Safari, poi «Aggiungi alla schermata Home»."],
      el("button", { class: "btn", type: "button", onclick: () => { rimanda(); chiudi(); } }, "Ho capito")), 2500);
  }
})();

// ---------------------------------------------------------------------- aggiornamenti
// Un'app installata resta aperta in background anche per giorni: si cerca una versione nuova all'avvio e ogni volta
// che la pagina torna in primo piano. Quando il nuovo service worker prende il controllo la pagina si ricarica da
// sola; durante una simulazione d'esame non consegnata compare invece un avviso con il pulsante «Aggiorna».
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.SENZA_SW) {
  const avevaVersione = !!navigator.serviceWorker.controller;   // false alla prima visita: niente da ricaricare
  let ultimoControllo = 0, giaAvvisato = false;
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
      ultimoControllo = Date.now();
      const controlla = () => {
        if (Date.now() - ultimoControllo < 60000) return;
        ultimoControllo = Date.now();
        reg.update().catch(() => {});
      };
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") controlla(); });
      window.addEventListener("online", controlla);
    }).catch(() => {});
  });
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!avevaVersione || giaAvvisato) return;
    giaAvvisato = true;
    if (!(esame && !esame.consegnato)) { location.reload(); return; }
    const box = el("div", { class: "installa", role: "status" },
      document.querySelector(".marchio .logo").cloneNode(true),
      el("div", {}, el("strong", {}, "Nuova versione disponibile"),
        el("p", {}, "Si aggiorna alla prossima apertura, oppure subito: la simulazione in corso andrebbe persa.")),
      el("div", { class: "azioni" },
        el("button", { class: "btn sec", type: "button", onclick: () => box.remove() }, "Dopo"),
        el("button", { class: "btn", type: "button", onclick: () => location.reload() }, "Aggiorna")));
    document.body.append(box);
  });
}
